# Permalinks
#
# Use of `relative_permalinks` ensures post links from the index work properly.
#permalink:           pretty

permalink: /:year/:month/:day/:title:output_ext

# removed for Jekyll v3.0
#relative_permalinks: true

# Setup
title:               akaAK
tagline:             Kiran (AK) Adapa's engineering, tech, findings blog
paginate:            1
url:                 "https://akaak.github.io"
baseurl:             "/blog"

# added for Jekyll v3.0
#gems: [jekyll-paginate]
#paginate_path: "page:num"

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

paginate: 5  # Number of posts per page
# paginate_path: "/page:num/"  # URL structure for paginated pages

# Micro-blog collection (short posts, separate from _posts)
collections:
  micro:
    output: true
    permalink: /micro/:year/:month/:day/:title:output_ext

# Assets
#
# We specify the directory for Jekyll so we can use @imports.
sass:
  sass_dir:          _sass
  style:            :compressed

# About/contact
author:
  name:              Kiran (AK) Adapa
  url:               https://twitter.com/akadapa
  email:             akadapa@gmail.com

# jekyll-seo-tag
twitter:
  username: akadapa
  card: summary
logo: /public/apple-touch-icon-precomposed.png

# Custom vars
version:             1.3.0
github:
  repo:              https://github.com/akaak

# List of pages to include in the header.
pages_list:
  About: '/about'
  Archive: '/archive'
  Categories: '/categories'
  Micro: '/micro'
  Photos: '/photos'
  Feed: '/atom.xml'
